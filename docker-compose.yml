services:

  localstack:
    image: localstack/localstack:latest
    container_name: cloudsec-localstack

    ports:
      - "4566:4566"

    environment:
      SERVICES: s3,iam,sts
      DEBUG: 0
      AWS_DEFAULT_REGION: us-east-1
      DEFAULT_REGION: us-east-1

    volumes:
      - localstack_data:/var/lib/localstack

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:4566/_localstack/health || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  vulnerable-app:
    image: nginx:alpine
    container_name: cloudsec-vulnerable-app

    privileged: true

    volumes:
      - lab_host:/host

    ports:
      - "8080:80"

    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /host/root
        echo 'FLAG{cl0ud_esc4p3_succ3ss}' > /host/root/flag.txt
        exec nginx -g 'daemon off;'

    depends_on:
      localstack:
        condition: service_healthy


  ctf:
    image: nginx:alpine
    container_name: cloudsec-ctf

    ports:
      - "8090:80"

    volumes:
      - ./ctf:/usr/share/nginx/html:ro

    depends_on:
      - localstack
      - vulnerable-app


volumes:
  localstack_data:
  lab_host:
